name: One-time formatting repair
on:
  push:
    branches: [chore/fix-ci-lockfile]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: format workspace [formatted]" && git push origin HEAD:chore/fix-ci-lockfile)
