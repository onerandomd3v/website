name: Bootstrap dependency lockfile
on:
  push:
    branches: [chore/fix-ci-lockfile]
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate pnpm lockfile [lockfile generated]"
          git push origin HEAD:chore/fix-ci-lockfile
